# Phase 4: database + local S3-compatible storage. Backend and frontend services are added in Phase 9.
# Values come from ./.env (copy .env.example → .env).
services:
  postgres:
    image: postgres:16-alpine
    container_name: image-wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-image_wallet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, open-source S3-compatible object storage (replaces AWS S3 locally).
  # The backend talks to it with the regular AWS SDK v3; switching to real S3 is an .env change.
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: image-wallet-s3
    restart: unless-stopped
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  s3_data:
